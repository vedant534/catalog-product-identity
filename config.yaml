split_seed: 20260825
model_seed: 42
split_ratios: [0.70, 0.15, 0.15]

dataset_url: https://dbs.uni-leipzig.de/files/datasets/Amazon-GoogleProducts.zip
raw_dir: data/raw
artifacts_dir: artifacts
reports_dir: reports
model_cache_dir: .cache/huggingface

sentence_model: sentence-transformers/all-MiniLM-L6-v2
sentence_model_revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
dense_batch_size: 64
top_k: 20
rrf_constant: 60
recall_ks: [5, 10, 20]

tfidf_ngram_range: [3, 5]
tfidf_min_df: 1
tfidf_max_features: 50000

calibration_folds: 3
logreg_max_iter: 1000

match_precision_target: 0.95
no_match_precision_target: 0.95
min_auto_match_support: 20
min_auto_no_match_support: 20
threshold_grid_step: 0.01
error_examples_per_type: 10
